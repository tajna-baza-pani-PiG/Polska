<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polska – Testy Geograficzne</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#eef2f5; }
        #container { padding:10px; max-width:960px; margin:auto; }
        #map { height:68vh; min-height:480px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.25); }
        #question { font-size:23px; font-weight:bold; margin:15px 0; min-height:35px; }
        #score { font-size:19px; font-weight:bold; margin-bottom:8px; }
        #counter { font-size:17px; color:#444; margin-bottom:8px; }
        button { padding:12px 16px; font-size:17px; border:none; border-radius:8px; cursor:pointer; }
        .mode-buttons { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
        .mode-buttons button.active { background:#2d89ef; color:white; }
        #next { width:100%; background:#2d89ef; color:white; margin-top:10px; font-size:18px; display:none; }
        #legend { margin-top:15px; padding:12px; background:white; border-radius:10px; font-size:14.5px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        .color-dot { width:16px; height:16px; border-radius:50%; display:inline-block; margin-right:8px; border:2px solid white; box-shadow:0 0 3px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div id="container">
    <div class="mode-buttons">
        <button onclick="setMode(0)" id="btn0">🧪 Test – Obiekty</button>
        <button onclick="setMode(1)" id="btn1">🧪 Test – Fizyczna</button>
    </div>

    <div id="score"></div>
    <div id="counter"></div>
    <div id="question"></div>
    <div id="map"></div>
    <button id="next">Następne pytanie</button>
    <div id="legend"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== DANE – POLSKA ====================
const colors = {
    water:   "#1e4a7a",
    mountain:"#5c4033",
    lowland: "#4a8c3d",
    coast:   "#d17f2a",
    lake:    "#2a7a9c",
    river:   "#1e7a9c",
    peak:    "#6b2a2a",
    park:    "#2e8b57",
    region:  "#8b5a2b"
};

const allFeatures = [ /* Twoja pełna lista obiektów – bez zmian */ 
    // (wklej tutaj całą tablicę allFeatures z poprzedniej wersji)
    {name:"Pobrzeża", lat:54.8, lng:17.5, color:colors.coast, type:"physical"},
    {name:"Pojezierza", lat:53.8, lng:18.5, color:colors.lowland, type:"physical"},
    {name:"Niziny Środkowopolskie", lat:52.2, lng:19.5, color:colors.lowland, type:"physical"},
    {name:"Wyżyny Polskie", lat:50.8, lng:20.5, color:colors.region, type:"physical"},
    {name:"Kotliny Podkarpackie", lat:49.8, lng:22.0, color:colors.lowland, type:"physical"},
    {name:"Karpaty", lat:49.5, lng:20.0, color:colors.mountain, type:"physical"},
    {name:"Sudety", lat:50.7, lng:16.0, color:colors.mountain, type:"physical"},
    // ... reszta obiektów (Pobrzeże Szczecińskie, Wisła, Rysy, parki itd.)
    {name:"Morze Bałtyckie", lat:54.8, lng:18.5, color:colors.water, type:"physical"},
    {name:"Wisła", lat:52.2, lng:21.0, color:colors.river, type:"physical"},
    {name:"Rysy", lat:49.18, lng:20.09, color:colors.peak, type:"physical"},
    {name:"Tatrzański Park Narodowy", lat:49.25, lng:19.95, color:colors.park, type:"physical"}
    // Dodaj wszystkie pozostałe obiekty z poprzedniej wersji
];

let map, currentLayer;
let physicalLayer, politicalNoLabelLayer, noLabelLayer;
let markers = [];
let mode = 0;
let quiz = [], score = 0, current = 0, answered = false;
let autoAdvanceTimeout = null;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function initMap() {
    map = L.map('map', {
        maxBounds: [[48.5, 13.5], [55.5, 24.5]],   // lekko poszerzone
        maxBoundsViscosity: 0.8,                   // zmniejszona sztywność
        minZoom: 5,                                // najważniejsze – obniżone
        maxZoom: 11,
        touchZoom: true,
        scrollWheelZoom: true,
        bounceAtZoomLimits: false
    }).setView([52.1, 19.0], 6);

    physicalLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');
    politicalNoLabelLayer = L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_nolabels/{z}/{x}/{y}.png');
    noLabelLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

    currentLayer = politicalNoLabelLayer;
    currentLayer.addTo(map);
}

// Reszta kodu bez zmian (clearMarkers, loadMarkers, markerClick, setMode itd.)
// ... wklej resztę funkcji z poprzedniej wersji

function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

function loadMarkers(filteredFeatures) {
    clearMarkers();
    filteredFeatures.forEach((f, i) => {
        const marker = L.circleMarker([f.lat, f.lng], {
            radius: 9.5,
            color: "#ffffff",
            weight: 2.8,
            fillColor: f.color,
            fillOpacity: 0.94
        }).addTo(map);
        marker.on("click", () => markerClick(i, marker, filteredFeatures));
        markers.push(marker);
    });
}

// (pozostałe funkcje: markerClick, nextQuestion, setMode, showQuestion, updateLegend – bez zmian)

document.getElementById("next").onclick = nextQuestion;

window.onload = () => {
    initMap();
    setTimeout(() => map.invalidateSize(), 300);
    setMode(0);
};
</script>
</body>
</html>
