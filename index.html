<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polska – Test Geograficzny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Lato', sans-serif;
  background: #eef2f7;
}

#container {
  padding: 14px 12px;
  max-width: 980px;
  margin: auto;
}

/* ── Nagłówek ── */
#header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
#header h1 {
  font-family: 'Merriweather', serif;
  font-size: 19px;
  margin: 0;
  color: #1a2e4a;
}

/* ── Przyciski trybu ── */
.mode-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.mode-buttons button {
  padding: 8px 18px;
  font-size: 14px;
  font-family: 'Lato', sans-serif;
  font-weight: 700;
  border: 2px solid #c5cfe0;
  border-radius: 20px;
  cursor: pointer;
  background: #fff;
  color: #4a5568;
  transition: all .15s;
}
.mode-buttons button:hover  { border-color: #2d89ef; color: #2d89ef; }
.mode-buttons button.active { background: #2d89ef; border-color: #2d89ef; color: #fff; }

/* ── Panel quizu ── */
#quiz-panel {
  background: #fff;
  border-radius: 12px;
  padding: 8px 14px;
  margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#counter {
  font-size: 11px;
  color: #8896aa;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  line-height: 1.3;
}
#question {
  font-size: 18px;
  font-weight: 700;
  color: #1a2e4a;
  line-height: 1.3;
}
#feedback {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
}
#feedback:empty { display: none; }
#feedback.correct { color: #1b7c3f; }
#feedback.wrong   { color: #b91c1c; }
#score {
  font-size: 12px;
  color: #4a5568;
  border-top: 1px solid #eef2f7;
  padding-top: 4px;
  margin-top: 2px;
  line-height: 1.3;
}
#score b { color: #2d89ef; font-size: 13px; }

/* ── Mapa ── */
#map {
  /* Zajmuje całą dostępną przestrzeń w oknie po odjęciu górnych elementów */
  height: calc(100vh - 190px);
  min-height: 340px;
  border-radius: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18);
  overflow: hidden;
}

/* Tryb krainy: mapa jeszcze wyższa bo nie ma legendy pod spodem */
body.mode-krainy #map {
  height: calc(100vh - 185px);
}

@media (max-width: 600px) {
  #map {
    height: calc(100vh - 210px);
    min-height: 260px;
    border-radius: 10px;
  }
  body.mode-krainy #map {
    height: calc(100vh - 205px);
  }
  #header h1 { font-size: 15px; }
  #question  { font-size: 16px; }
}

/* ── Legenda ── */
#legend {
  margin-top: 10px;
  padding: 12px 16px;
  background: #fff;
  border-radius: 10px;
  font-size: 13px;
  color: #4a5568;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
/* W trybie krain legenda jest ukryta (display:none ustawiane przez JS) */
#legend b { color: #1a2e4a; display: block; margin-bottom: 8px; }
.leg-section { margin-bottom: 10px; }
.leg-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #8896aa;
  margin-bottom: 5px;
}
.leg-row { display: flex; flex-wrap: wrap; gap: 5px 16px; }
.leg-item { display: flex; align-items: center; gap: 6px; line-height: 1.4; }
.dot  { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.12); }
.icon-sym { font-size: 14px; line-height: 1; }
.line-sym { width: 22px; height: 4px; border-radius: 2px; flex-shrink: 0; background: #1565c0; }
</style>
</head>
<body>
<div id="container">

  <div id="header">
    <span style="font-size:26px">🇵🇱</span>
    <h1>Test Geograficzny – Polska</h1>
  </div>

  <div class="mode-buttons">
    <button onclick="setMode('krainy')" id="btn-krainy">🗺 Krainy Geograficzne</button>
    <button onclick="setMode('punkty')" id="btn-punkty">📍 Rzeki i Obiekty</button>
  </div>

  <div id="quiz-panel">
    <div id="counter"></div>
    <div id="question"></div>
    <div id="feedback"></div>
    <div id="score"></div>
  </div>

  <div id="map"></div>
  <div id="legend"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// ════════════════════════════════════════════════════════
//  DANE – KRAINY GEOGRAFICZNE
//  Pobierane z oficjalnego API GDOŚ (Geoserwis) w czasie ładowania strony
// ════════════════════════════════════════════════════════

// Mapowanie nazw makroregionów → kolory
var KRAINY_COLORS = {
  "Pobrzeże Szczecińskie":             "#0d47a1",
  "Pobrzeże Koszalińskie":             "#1565c0",
  "Pobrzeże Słowińskie":               "#1976d2",
  "Żuławy Wiślane":                    "#1e88e5",
  "Pojezierze Pomorskie":              "#2e7d32",
  "Pojezierze Mazurskie":              "#388e3c",
  "Nizina Wielkopolska":               "#795548",
  "Nizina Mazowiecka":                 "#8d6e63",
  "Nizina Śląska":                     "#6d4c41",
  "Podlasie":                          "#4e342e",
  "Wyżyna Krakowsko-Częstochowska":    "#e64a19",
  "Góry Świętokrzyskie":               "#b71c1c",
  "Wyżyna Lubelska":                   "#f4511e",
  "Tatry":                             "#7b1fa2",
  "Bieszczady":                        "#6a1aad"
};

// Lista krain do wyświetlenia (filtrujemy po nazwie)
var KRAINY_NAMES = Object.keys(KRAINY_COLORS);

// GeoJSON załadowany z API – wypełniany asynchronicznie
var KRAINY_GEOJSON = null;

// Pobiera dane z GDOŚ WFS (makroregiony fizycznogeograficzne)
// URL: publiczny WFS Geoserwis GDOŚ, warstwa mezoregionów/makroregionów
function loadKrainyGeoJSON(callback) {
  // GDOŚ udostępnia warstwy przez publiczny WFS
  // Używamy makroregionów (poziom 4 w hierarchii Kondrackiego)
  var wfsUrl = 'https://geoserwis.gdos.gov.pl/mapy/ows?service=WFS&version=1.1.0' +
    '&request=GetFeature&typeName=geoserwis:makroregiony_fizycznogeograficzne' +
    '&outputFormat=application/json&srsName=EPSG:4326';

  fetch(wfsUrl)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      KRAINY_GEOJSON = data;
      callback(null, data);
    })
    .catch(function(err) {
      // Fallback: spróbuj alternatywnego endpointu
      var fallbackUrl = 'https://geoserwis.gdos.gov.pl/mapy/ows?service=WFS&version=2.0.0' +
        '&request=GetFeature&typeNames=geoserwis:makroregiony_fizycznogeograficzne' +
        '&outputFormat=application/json&srsName=EPSG:4326';
      fetch(fallbackUrl)
        .then(function(r) { return r.json(); })
        .then(function(data) { KRAINY_GEOJSON = data; callback(null, data); })
        .catch(function(e) { callback(e, null); });
    });
}

// ════════════════════════════════════════════════════════
//  DANE – RZEKI i PUNKTY
// ════════════════════════════════════════════════════════

var RZEKI = [
  // Wisła: źródło w Beskidach (Barania Góra ~49.65, 18.85) → Kraków → Warszawa → Toruń → Gdańsk
  { name: "Wisła", cat: "river",
    coords: [
      [49.65,18.85],[49.89,19.47],[50.06,19.94],[50.26,20.46],
      [50.54,21.73],[51.05,21.87],[51.40,21.97],[51.67,21.75],
      [52.23,21.01],[52.52,20.97],[52.93,20.72],[53.17,18.69],
      [53.45,18.77],[53.69,18.66],[54.08,18.75],[54.22,18.68],
      [54.36,18.64]
    ]
  },

  // Odra: źródło w Czechach (ok. 49.78, 17.68) → Ostrava → Wrocław → Szczecin
  { name: "Odra", cat: "river",
    coords: [
      [49.87,17.88],[50.22,17.93],[50.35,17.97],[50.67,17.12],
      [51.10,17.04],[51.40,16.94],[51.68,16.25],[51.93,15.51],
      [52.33,14.90],[52.72,14.43],[53.05,14.25],[53.42,14.55]
    ]
  },

  // Warta: źródło koło Kromołowa (50.55, 19.55) → Częstochowa → Sieradz → Poznań → Kostrzyn nad Odrą
  { name: "Warta", cat: "river",
    coords: [
      [50.55,19.55],[50.81,19.12],[50.98,18.97],[51.35,18.71],
      [51.60,18.55],[51.77,18.08],[51.91,17.87],[52.05,17.58],
      [52.22,17.01],[52.41,16.93],[52.62,16.58],[52.73,16.17],
      [52.58,15.80],[52.61,14.99],[52.59,14.65]
    ]
  },

  // Bug: źródło na Ukrainie → Brest → Drohiczyn → ujście do Narwi koło Serocka
  { name: "Bug", cat: "river",
    coords: [
      [51.15,24.00],[51.37,23.69],[51.57,23.68],[51.83,23.52],
      [52.05,23.70],[52.34,23.37],[52.54,23.44],[52.79,22.68],
      [52.76,21.97],[52.60,21.52],[52.47,21.32]
    ]
  }
];

var KAT_PUNKTY = {
  sea:  { fill: "#0277bd", icon: "🌊", opis: "Morza i akweny" },
  lake: { fill: "#29b6f6", icon: "💧", opis: "Jeziora"       },
  peak: { fill: "#c62828", icon: "⛰",  opis: "Szczyty górskie" },
  park: { fill: "#2e7d32", icon: "🌿", opis: "Parki Narodowe" }
};

var PUNKTY = [
  // Morza i akweny – precyzyjne środki
  { name: "Morze Bałtyckie",   cat: "sea",  lat: 55.00, lng: 17.50 },
  { name: "Zatoka Gdańska",    cat: "sea",  lat: 54.65, lng: 19.10 },
  { name: "Zalew Szczeciński", cat: "sea",  lat: 53.82, lng: 14.32 },
  { name: "Zalew Wiślany",     cat: "sea",  lat: 54.33, lng: 19.53 },

  // Jeziora mazurskie
  { name: "Śniardwy",          cat: "lake", lat: 53.73, lng: 21.73 },
  { name: "Mamry",             cat: "lake", lat: 54.13, lng: 21.73 },
  // Łebsko – jezioro przybrzeżne na Pobrzeżu Słowińskim
  { name: "Łebsko",            cat: "lake", lat: 54.72, lng: 17.40 },

  // Szczyty
  // Rysy – granica PL/SK w Tatrach
  { name: "Rysy",              cat: "peak", lat: 49.18, lng: 20.08 },
  // Śnieżka – najwyższy szczyt Karkonoszy/Sudetów
  { name: "Śnieżka",           cat: "peak", lat: 50.74, lng: 15.74 },
  // Łysica – najwyższy szczyt Gór Świętokrzyskich
  { name: "Łysica",            cat: "peak", lat: 50.91, lng: 20.91 },

  // Parki Narodowe – centra obszarów
  { name: "Tatrzański PN",     cat: "park", lat: 49.23, lng: 19.98 },
  { name: "Białowieski PN",    cat: "park", lat: 52.75, lng: 23.87 },
  { name: "Biebrzański PN",    cat: "park", lat: 53.45, lng: 22.73 },
  { name: "Słowiński PN",      cat: "park", lat: 54.68, lng: 17.45 },
  { name: "Kampinoski PN",     cat: "park", lat: 52.32, lng: 20.51 }
];


// ════════════════════════════════════════════════════════
//  MAPA
// ════════════════════════════════════════════════════════
var map, topoLayer, osmLayer, activeTileLayer;
var geoLayers = [];

function initMap() {
  // Miękkie ograniczenia – nie blokujemy twardego minZoom,
  // pozwalamy oddalić się swobodnie; soft maxBounds tylko lekko "odbija"
  map = L.map('map', {
    maxBoundsViscosity: 0.5,   // miękkie odbicie od granic, nie blokuje
    minZoom: 5,                // można się oddalić na całą Europę
    maxZoom: 12
  }).setView([52.1, 19.4], 6);

  // Luźne granice – mapa "ciągnie" z powrotem do Polski, ale nie blokuje oddalenia
  map.setMaxBounds([[45.0, 8.0], [57.5, 28.0]]);

  // OSM z polskimi nazwami
  topoLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 13
  });

  // Warstwa granic Polski z Geoportal GUGiK (WMS)
  var borderLayer = L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/WMTS/guest/wmts/TOPO', {
    layers: 'TOPO',
    format: 'image/png',
    transparent: true,
    attribution: '&copy; GUGiK',
    opacity: 0.0  // niewidoczna – używamy tylko OSM
  });
  // Nie dodajemy WMS – standardowy OSM ma granice Polski
  osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  });

  activeTileLayer = topoLayer;
  topoLayer.addTo(map);

  // Granica Polski – uproszczony obrys dla orientacji
  var polandBorder = [
    [54.45,18.55],[54.83,18.40],[54.38,19.55],[54.22,22.78],[54.33,23.48],
    [53.98,23.88],[53.45,23.48],[52.52,23.60],[51.97,23.47],[50.38,22.88],
    [49.55,22.50],[49.18,20.55],[49.07,20.22],[49.10,19.92],[49.23,18.85],
    [49.42,18.62],[49.38,18.10],[49.48,17.52],[49.87,17.88],[50.22,17.93],
    [50.35,16.65],[50.43,16.00],[51.00,15.00],[51.55,14.90],[52.63,14.12],
    [53.42,14.55],[54.10,14.18],[54.55,14.60],[54.60,15.00],[54.52,15.45],
    [54.80,16.88],[54.93,17.92],[54.45,18.55]
  ];
  L.polyline(polandBorder, {
    color: '#c0392b', weight: 3, opacity: 0.9, dashArray: null
  }).addTo(map);
}

function clearLayers() {
  for (var i = 0; i < geoLayers.length; i++) map.removeLayer(geoLayers[i]);
  geoLayers = [];
}

// Oblicza środek ciężkości poligonu (centroid)
function centroid(coords) {
  var lat = 0, lng = 0;
  for (var i = 0; i < coords.length; i++) { lat += coords[i][0]; lng += coords[i][1]; }
  return [lat / coords.length, lng / coords.length];
}

function renderKrainy() {
  clearLayers();
  if (!KRAINY_GEOJSON) return;

  var features = KRAINY_GEOJSON.features || [];
  features.forEach(function(feature) {
    // Szukamy nazwy w różnych możliwych polach
    var props = feature.properties || {};
    var name = props.NAZWAGLOWN || props.nazwa || props.name || props.NAZWA || '';

    // Sprawdzamy czy ta kraina jest na naszej liście
    var matchedName = null;
    for (var i = 0; i < KRAINY_NAMES.length; i++) {
      if (name.toLowerCase().indexOf(KRAINY_NAMES[i].toLowerCase()) >= 0 ||
          KRAINY_NAMES[i].toLowerCase().indexOf(name.toLowerCase()) >= 0) {
        matchedName = KRAINY_NAMES[i];
        break;
      }
    }
    if (!matchedName) return;

    var color = KRAINY_COLORS[matchedName] || '#c0392b';
    var style = {
      color: '#1a2e4a', weight: 2, opacity: 0.9,
      fillColor: color, fillOpacity: 0.25
    };

    var layer = L.geoJSON(feature, {
      style: style,
      onEachFeature: function(f, l) {
        l.featureName = matchedName;
        l.on('click', function(e) {
          L.DomEvent.stopPropagation(e);
          handleAnswer(matchedName);
        });
      }
    });
    layer.featureName = matchedName;
    layer.addTo(map);
    geoLayers.push(layer);
  });
}

function renderPunkty() {
  clearLayers();

  for (var i = 0; i < RZEKI.length; i++) {
    (function(r) {
      var line = L.polyline(r.coords, {
        color: '#1565c0', weight: 5, opacity: 0.9
      });
      line.featureName = r.name;
      line.on('click', function(e) {
        L.DomEvent.stopPropagation(e);
        handleAnswer(r.name);
      });
      line.addTo(map);
      geoLayers.push(line);
    })(RZEKI[i]);
  }

  for (var j = 0; j < PUNKTY.length; j++) {
    (function(p) {
      var st = KAT_PUNKTY[p.cat];
      var icon = L.divIcon({
        className: '',
        html: '<div style="'
            + 'background:' + st.fill + ';'
            + 'color:#fff;width:32px;height:32px;'
            + 'border-radius:50%;display:flex;'
            + 'align-items:center;justify-content:center;'
            + 'font-size:16px;border:3px solid #fff;'
            + 'box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer'
            + '">' + st.icon + '</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
      var marker = L.marker([p.lat, p.lng], { icon: icon });
      marker.featureName = p.name;
      marker._correctIcon = L.divIcon({
        className: '',
        html: '<div style="background:#00c853;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #006622;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer">' + st.icon + '</div>',
        iconSize: [32,32], iconAnchor: [16,16]
      });
      marker._wrongIcon = L.divIcon({
        className: '',
        html: '<div style="background:#ef4444;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #991b1b;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer">' + st.icon + '</div>',
        iconSize: [32,32], iconAnchor: [16,16]
      });
      marker.on('click', function(e) {
        L.DomEvent.stopPropagation(e);
        handleAnswer(p.name);
      });
      marker.addTo(map);
      geoLayers.push(marker);
    })(PUNKTY[j]);
  }
}


// ════════════════════════════════════════════════════════
//  QUIZ
// ════════════════════════════════════════════════════════
var quiz = [], score = 0, current = 0, answered = false;
var autoTimer = null;
var currentMode = 'krainy';

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

function handleAnswer(clicked) {
  if (answered) return;
  answered = true;
  var correct = quiz[current];
  var ok = (clicked === correct);
  if (ok) score++;

  var fb = document.getElementById('feedback');
  fb.className  = ok ? 'correct' : 'wrong';
  fb.textContent = ok
    ? '✔ Dobrze! To ' + correct
    : '✘ Błąd – wybrałeś: „' + clicked + '". Prawidłowo: „' + correct + '"';

  highlightLayer(clicked,  ok ? '#00c853' : '#ef4444');
  if (!ok) highlightLayer(correct, '#00c853');

  document.getElementById('score').innerHTML = 'Wynik: <b>' + score + '</b> / ' + quiz.length;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(nextQuestion, 2600);
}

function highlightLayer(name, color) {
  for (var i = 0; i < geoLayers.length; i++) {
    var l = geoLayers[i];
    if (l.featureName !== name) continue;
    if (l.setIcon) {
      // Marker punktowy
      var isCorrect = (color === '#00c853');
      l.setIcon(isCorrect ? l._correctIcon : l._wrongIcon);
    } else if (l.eachLayer) {
      // L.geoJSON – iterujemy po sublayerach
      l.eachLayer(function(sub) {
        if (sub.setStyle) sub.setStyle({ fillColor: color, fillOpacity: 0.60, color: color, weight: 3 });
      });
    } else if (l.setStyle) {
      // L.polyline (rzeki)
      l.setStyle({ color: color, weight: 7, opacity: 1 });
    }
  }
}

function nextQuestion() {
  current++;
  if (current >= quiz.length) {
    var pct = Math.round(score / quiz.length * 100);
    alert('Koniec testu!\nWynik: ' + score + '/' + quiz.length + ' (' + pct + '%) 🎉');
    setMode(currentMode);
    return;
  }
  if (currentMode === 'krainy') renderKrainy(); else renderPunkty();
  showQuestion();
}

function showQuestion() {
  document.getElementById('counter').textContent  = 'Pytanie ' + (current + 1) + ' / ' + quiz.length;
  document.getElementById('question').textContent = '▸ ' + quiz[current];
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className   = '';
  document.getElementById('score').innerHTML      = 'Wynik: <b>' + score + '</b> / ' + quiz.length;
  answered = false;
}


// ════════════════════════════════════════════════════════
//  TRYBY
// ════════════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  score = 0; current = 0; answered = false;
  clearTimeout(autoTimer);

  document.querySelectorAll('.mode-buttons button').forEach(function(b) {
    b.classList.remove('active');
  });
  document.getElementById('btn-' + mode).classList.add('active');

  map.removeLayer(activeTileLayer);
  activeTileLayer = (mode === 'punkty') ? osmLayer : topoLayer;
  activeTileLayer.addTo(map);

  if (mode === 'krainy') {
    renderKrainy();
    quiz = KRAINY_NAMES.slice(); // kopia listy krain
  } else {
    renderPunkty();
    quiz = RZEKI.concat(PUNKTY).map(function(o) { return o.name; });
  }

  shuffle(quiz);
  updateLegend(mode);
  showQuestion();
}

// ════════════════════════════════════════════════════════
//  LEGENDA
// ════════════════════════════════════════════════════════
function updateLegend(mode) {
  var el = document.getElementById('legend');

  // Ustaw klasę na body do sterowania wysokością mapy
  document.body.className = 'mode-' + mode;

  if (mode === 'krainy') {
    // Krainy: brak legendy
    el.style.display = 'none';
    el.innerHTML = '';
  } else {
    // Punkty: legenda widoczna pod mapą (dostępna po scroll)
    el.style.display = 'block';
    var katItems = Object.keys(KAT_PUNKTY).map(function(cat) {
      var k = KAT_PUNKTY[cat];
      return '<span class="leg-item">'
           + '<span class="icon-sym">' + k.icon + '</span>'
           + k.opis + '</span>';
    }).join('');
    el.innerHTML =
      '<b>Rzeki i obiekty geograficzne Polski</b>'
      + '<div class="leg-section">'
      + '<div class="leg-section-title">Rzeki (kliknij linię)</div>'
      + '<div class="leg-row">'
      + '<span class="leg-item"><span class="line-sym"></span>Wisła, Odra, Warta, Bug</span>'
      + '</div></div>'
      + '<div class="leg-section">'
      + '<div class="leg-section-title">Punkty (kliknij marker)</div>'
      + '<div class="leg-row">' + katItems + '</div>'
      + '</div>';
  }
}


// ════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════
window.onload = function() {
  initMap();
  setTimeout(function() { map.invalidateSize(); }, 200);

  // Pokaż komunikat ładowania
  document.getElementById('question').textContent = '⏳ Ładowanie granic krain geograficznych...';

  // Załaduj dane GeoJSON z GDOŚ
  loadKrainyGeoJSON(function(err, data) {
    if (err || !data || !data.features || data.features.length === 0) {
      // Jeśli API niedostępne – uruchom z uproszczonymi danymi
      console.warn('GDOŚ API niedostępne, używam danych uproszczonych:', err);
      KRAINY_GEOJSON = buildFallbackGeoJSON();
    }
    setMode('krainy');
  });
};
