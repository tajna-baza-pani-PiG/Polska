<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polska – Test Geograficzny</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; font-family:'Lato',sans-serif; background:#eef2f7; }
        #container { padding:14px 12px; max-width:980px; margin:auto; }
        #header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        #header h1 { font-family:'Merriweather',serif; font-size:19px; margin:0; color:#1a2e4a; }
        .mode-buttons { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
        .mode-buttons button { padding:8px 18px; font-size:14px; font-family:'Lato',sans-serif; font-weight:700; border:2px solid #c5cfe0; border-radius:20px; cursor:pointer; background:#fff; color:#4a5568; transition:all .15s; }
        .mode-buttons button:hover { border-color:#2d89ef; color:#2d89ef; }
        .mode-buttons button.active { background:#2d89ef; border-color:#2d89ef; color:#fff; }
        #quiz-panel { background:#fff; border-radius:12px; padding:11px 16px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.07); display:flex; flex-direction:column; gap:4px; }
        #counter { font-size:12px; color:#8896aa; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
        #question { font-size:20px; font-weight:700; color:#1a2e4a; min-height:30px; }
        #feedback { font-size:15px; min-height:20px; font-weight:700; padding:2px 0; }
        #feedback.correct { color:#1b7c3f; }
        #feedback.wrong   { color:#b91c1c; }
        #score { font-size:13px; color:#4a5568; border-top:1px solid #eef2f7; padding-top:5px; margin-top:2px; }
        #score b { color:#2d89ef; font-size:15px; }
        #map { height:68vh; min-height:480px; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.18); position:relative; overflow:hidden; }
        #next { width:100%; padding:12px; margin-top:10px; background:#2d89ef; color:#fff; font-family:'Lato',sans-serif; font-size:16px; font-weight:700; border:none; border-radius:10px; cursor:pointer; display:none; box-shadow:0 3px 10px rgba(45,137,239,.4); transition:background .15s; }
        #next:hover { background:#1a6fcc; }
        #legend { margin-top:10px; padding:10px 14px; background:#fff; border-radius:10px; font-size:13px; line-height:1.8; color:#4a5568; box-shadow:0 1px 4px rgba(0,0,0,.06); }
        #legend b { color:#1a2e4a; }
        .leg-row { display:flex; flex-wrap:wrap; gap:5px 16px; margin-top:4px; }
        .leg-item { display:flex; align-items:center; gap:5px; }
        .dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,.15); }
        .line-sym { width:22px; height:4px; border-radius:2px; flex-shrink:0; }
        #status-bar { margin-top:8px; padding:6px 12px; border-radius:8px; font-size:12px; color:#555; background:#f8f9fb; display:none; }
        /* Ukryj WSZYSTKIE tooltips Leafleta i natywne title SVG */
        .leaflet-tooltip { display:none !important; visibility:hidden !important; }
        #map svg title { display:none; }
    </style>
</head>
<body>

    <div class="mode-buttons">

    </div>
    <div id="quiz-panel">

        <div id="question"></div>
        <div id="feedback"></div>
        <div id="score"></div>
    </div>
    <div id="map"></div>
    <button id="next">Następne pytanie ▶</button>

</div>

const CAT_STYLE = {

// ════════════════════════════════════════
// STAN
// ════════════════════════════════════════
let map, topoLayer, osmLayer, currentTileLayer;
let geoLayers = [];
let quiz = [], score = 0, current = 0, answered = false;
let autoAdvanceTimeout = null;
let currentMode = 'krainy';
let wojGeoJSON = null; // cache pobranych danych

// ════════════════════════════════════════
// INICJALIZACJA MAPY
// ════════════════════════════════════════
function initMap() {
    map = L.map('map', {
        maxBounds:[[48.3,12.8],[55.6,25.2]], maxBoundsViscosity:.85,
        minZoom:6, maxZoom:12
    }).setView([52.1,19.4], 6);
    topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution:'© OpenTopoMap', opacity:.85 });
    osmLayer  = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' });
    currentTileLayer = topoLayer;
    topoLayer.addTo(map);
}

// ════════════════════════════════════════
// WARSTWY
// ════════════════════════════════════════
function clearGeoLayers() {
    geoLayers.forEach(l => map.removeLayer(l));
    geoLayers = [];
}

// Kluczowa funkcja – tworzy warstwę GeoJSON BEZ tooltipów
// Leaflet wstawia <title> do każdego <path> SVG – usuwamy to przez onEachFeature
function makeGeoLayer(features, color, krainaName) {
    const layer = L.geoJSON(
        { type:'FeatureCollection', features },
        {
            style: { color:'#1a2e4a', weight:1.8, opacity:.85, fillColor:color, fillOpacity:.45 },
            onEachFeature: (feature, sublayer) => {
                // Usuń <title> z SVG zaraz po dodaniu do mapy
                sublayer.on('add', () => {
                    const el = sublayer.getElement ? sublayer.getElement() : null;
                    if (el) {
                        el.querySelectorAll('title').forEach(t => t.remove());
                        el.removeAttribute('title');
                    }
                    // Też przeszukaj cały kontener mapy
                    document.querySelectorAll('#map title').forEach(t => t.remove());
                });
                sublayer.on('click', e => {
                    L.DomEvent.stopPropagation(e);
                    handleAnswer(krainaName, e.latlng);
                });
            }
        }
    );
    layer.featureName = krainaName;
    layer.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(krainaName, e.latlng); });
    layer.addTo(map);
    geoLayers.push(layer);
    // Dodatkowe czyszczenie po 200ms (gdy SVG już w DOM)
    setTimeout(() => document.querySelectorAll('#map title').forEach(t => t.remove()), 200);
    return layer;
}

function renderKrainyFromGeoJSON(gj) {
    // Grupuj features po krainie
    const groups = {};
    (gj.features || []).forEach(f => {
        const p = f.properties || {};
        const raw = (p.JPT_NAZWA_ || p.name || p.NAME_1 || p.VARNAME_1 || p.admin_name || '').toLowerCase().trim();
        const kraina = WOJ_KRAINA[raw];
        if (!kraina) return;
        if (!groups[kraina]) groups[kraina] = [];
        groups[kraina].push(f);
    });
    clearGeoLayers();
    Object.entries(groups).forEach(([kraina, features]) => {
        makeGeoLayer(features, COLOR_BY_NAME[kraina] || '#607d8b', kraina);
    });
}

function renderKrainyFallback() {
    clearGeoLayers();
    Object.entries(FALLBACK_COORDS).forEach(([name, latLngs]) => {
        const ring = latLngs.map(c => [c[1], c[0]]); // [lat,lng]→[lng,lat]
        ring.push(ring[0]);
        makeGeoLayer(
            [{ type:'Feature', properties:{}, geometry:{ type:'Polygon', coordinates:[ring] } }],
            COLOR_BY_NAME[name] || '#607d8b',
            name
        );
    });
}

async function renderKrainy() {
    // Spróbuj pobrać prawdziwe dane – jsdelivr (CDN z CORS dla GitHub)
    if (!wojGeoJSON) {
        const urls = [
            'https://cdn.jsdelivr.net/gh/waszkiewiczja/GeoJSON-Polska-Wojewodztwa-Powiaty-Gminy@main/wojewodztwa.geojson',
            'https://cdn.jsdelivr.net/gh/andilabs/polska-wojewodztwa-geojson@master/polska-wojewodztwa.geojson',
            'https://cdn.jsdelivr.net/gh/ppatrzyk/polska-geojson@master/wojewodztwa/wojewodztwa-min.geojson',
        ];
        for (const url of urls) {
            try {
                const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
                if (r.ok) {
                    wojGeoJSON = await r.json();
                    setStatus('✔ Prawdziwe granice województw załadowane', '#1b7c3f');
                    break;
                }
            } catch { /* następny URL */ }
        }
    }
    if (wojGeoJSON) {
        renderKrainyFromGeoJSON(wojGeoJSON);
    } else {
        renderKrainyFallback();
        setStatus('ℹ Używam uproszczonych granic (brak połączenia z serwerem GIS)', '#888');
    }
}

function renderOthers() {
    clearGeoLayers();
    OTHERS.forEach(item => {
        const st = CAT_STYLE[item.cat];
        let layer;
        if (item.cat === 'river') {
            const shadow = L.polyline(item.coords, { color:'#fff', weight:st.weight+5, opacity:.3, interactive:false });
            shadow.addTo(map);
            geoLayers.push(shadow);
            layer = L.polyline(item.coords, { color:st.color, weight:st.weight, opacity:st.opacity });
            layer.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(item.name, e.latlng); });
        } else {
            const icon = L.divIcon({
                className:'',
                html:`<div style="background:${st.fill};color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer">${st.icon}</div>`,
                iconSize:[32,32], iconAnchor:[16,16]
            });
            layer = L.marker([item.lat, item.lng], { icon, title:'' });
            layer.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(item.name, e.latlng); });
        }
        layer.featureName = item.name;
        layer.addTo(map);
        geoLayers.push(layer);
    });
    setTimeout(() => document.querySelectorAll('#map title').forEach(t => t.remove()), 200);
}

function setStatus(msg, color) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.style.color = color || '#555';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}

// ════════════════════════════════════════
// QUIZ
// ════════════════════════════════════════
function shuffle(arr) {
    for (let i = arr.length-1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function handleAnswer(clickedName, latlng) {
    if (answered) return;
    answered = true;
    const correct = quiz[current];
    const isCorrect = clickedName === correct;
    const fb = document.getElementById('feedback');
    fb.className = isCorrect ? 'correct' : 'wrong';
    fb.textContent = isCorrect
        ? '✔ Dobrze! To ' + correct
        : `✘ Błąd – wybrałeś: „${clickedName}". Prawidłowo: „${correct}"`;
    if (isCorrect) score++;
    pulseLayer(clickedName, isCorrect ? '#00c853' : '#ef4444');
    if (!isCorrect) pulseLayer(correct, '#00c853');
    document.getElementById('score').innerHTML = `Wynik: <b>${score}</b> / ${quiz.length}`;
    clearTimeout(autoAdvanceTimeout);
    autoAdvanceTimeout = setTimeout(advanceQuestion, 2600);
}

function pulseLayer(name, color) {
    const style = { fillColor:color, fillOpacity:.78, color:color, weight:3 };
    geoLayers.forEach(l => {
        if (l.featureName !== name) return;
        if (l.setStyle) l.setStyle(style);
        if (l.eachLayer) l.eachLayer(sub => { if (sub.setStyle) sub.setStyle(style); });
    });
}

function advanceQuestion() {
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    current++;
    if (current >= quiz.length) {
        const pct = Math.round(score / quiz.length * 100);
        alert(`Koniec testu!\nWynik: ${score}/${quiz.length} (${pct}%) 🎉`);
        setMode(currentMode);
        return;
    }
    if (currentMode === 'krainy') renderKrainy().then(showQuestion);
    else { renderOthers(); showQuestion(); }
}

function showQuestion() {
    document.getElementById('score').innerHTML     = `Wynik: <b>${score}</b> / ${quiz.length}`;
    document.getElementById('counter').textContent = `Pytanie ${current+1} / ${quiz.length}`;
    document.getElementById('question').textContent = '▸ ' + quiz[current];
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    answered = false;
}

// ════════════════════════════════════════
// TRYB
// ════════════════════════════════════════
async function setMode(mode) {
    currentMode = mode;
    score = 0; current = 0; answered = false;
    clearTimeout(autoAdvanceTimeout);
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    document.querySelectorAll('.mode-buttons button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mode).classList.add('active');
    map.removeLayer(currentTileLayer);
    currentTileLayer = (mode === 'others') ? osmLayer : topoLayer;
    currentTileLayer.addTo(map);

    if (mode === 'krainy') {
        quiz = KRAINY_META.map(k => k.name);
        shuffle(quiz);
        document.getElementById('next').style.display = 'block';
        updateLegend();
        showQuestion();
        await renderKrainy();
    } else {
        renderOthers();
        quiz = OTHERS.map(d => d.name);
        shuffle(quiz);
        document.getElementById('next').style.display = 'block';
        updateLegend();
        showQuestion();
    }
}

function updateLegend() {
    const el = document.getElementById('legend');
    if (currentMode === 'krainy') {
        const rows = KRAINY_META.map(k =>
            `<span class="leg-item"><span class="dot" style="background:${k.color}"></span>${k.name}</span>`
        ).join('');
        el.innerHTML = `<b>Krainy geograficzne Polski</b><div class="leg-row">${rows}</div>`;
    } else {
        el.innerHTML = `<b>Legenda:</b><div class="leg-row">
            <span class="leg-item"><span class="line-sym" style="background:#1565c0"></span>Rzeki</span>
            <span class="leg-item"><span class="dot" style="background:#0277bd"></span>Morza/akweny 🌊</span>
            <span class="leg-item"><span class="dot" style="background:#29b6f6"></span>Jeziora 💧</span>
            <span class="leg-item"><span class="dot" style="background:#c62828"></span>Szczyty ⛰</span>
            <span class="leg-item"><span class="dot" style="background:#2e7d32"></span>Parki PN 🌿</span>
        </div>`;
    }
}

// ════════════════════════════════════════
// START
// ════════════════════════════════════════
window.onload = () => {
    initMap();
    setTimeout(() => map.invalidateSize(), 200);
    setMode('krainy');
    document.getElementById('next').onclick = () => {
        if (!answered) return;
        clearTimeout(autoAdvanceTimeout);
        advanceQuestion();
    };
};
</script>
</body>
</html>
