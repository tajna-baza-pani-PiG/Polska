<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polska – Testy Geograficzne</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#eef2f5; }
        #container { padding:10px; max-width:960px; margin:auto; }
        #map { height:68vh; min-height:480px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.25); }
        #question { font-size:23px; font-weight:bold; margin:15px 0; min-height:35px; }
        #score { font-size:19px; font-weight:bold; margin-bottom:8px; }
        #counter { font-size:17px; color:#444; margin-bottom:8px; }
        button { padding:12px 16px; font-size:17px; border:none; border-radius:8px; cursor:pointer; }
        .mode-buttons { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
        .mode-buttons button.active { background:#2d89ef; color:white; }
        #next { width:100%; background:#2d89ef; color:white; margin-top:10px; font-size:18px; display:none; }
        #legend { margin-top:15px; padding:12px; background:white; border-radius:10px; font-size:14.5px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        .color-dot { width:16px; height:16px; border-radius:50%; display:inline-block; margin-right:8px; border:2px solid white; box-shadow:0 0 3px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div id="container">
    <div class="mode-buttons">
        <button onclick="setMode(0)" id="btn0">🧪 Test – Obiekty</button>
        <button onclick="setMode(1)" id="btn1">🧪 Test – Fizyczna</button>
    </div>

    <div id="score"></div>
    <div id="counter"></div>
    <div id="question"></div>
    <div id="map"></div>
    <button id="next">Następne pytanie</button>
    <div id="legend"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== DANE – POLSKA ====================
const colors = {
    water:   "#1e4a7a",
    mountain:"#5c4033",
    lowland: "#4a8c3d",
    coast:   "#d17f2a",
    lake:    "#2a7a9c",
    river:   "#1e7a9c",
    peak:    "#6b2a2a",
    park:    "#2e8b57",
    region:  "#8b5a2b"
};

const allFeatures = [
    // 1. Pasy rzeźby terenu
    {name:"Pobrzeża", lat:54.8, lng:17.5, color:colors.coast, type:"physical"},
    {name:"Pojezierza", lat:53.8, lng:18.5, color:colors.lowland, type:"physical"},
    {name:"Niziny Środkowopolskie", lat:52.2, lng:19.5, color:colors.lowland, type:"physical"},
    {name:"Wyżyny Polskie", lat:50.8, lng:20.5, color:colors.region, type:"physical"},
    {name:"Kotliny Podkarpackie", lat:49.8, lng:22.0, color:colors.lowland, type:"physical"},
    {name:"Karpaty", lat:49.5, lng:20.0, color:colors.mountain, type:"physical"},
    {name:"Sudety", lat:50.7, lng:16.0, color:colors.mountain, type:"physical"},

    // 2. Krainy geograficzne
    {name:"Pobrzeże Szczecińskie", lat:53.8, lng:14.5, color:colors.coast, type:"physical"},
    {name:"Pobrzeże Koszalińskie", lat:54.2, lng:16.2, color:colors.coast, type:"physical"},
    {name:"Pobrzeże Słowińskie", lat:54.6, lng:17.0, color:colors.coast, type:"physical"},
    {name:"Pobrzeże Gdańskie", lat:54.4, lng:18.6, color:colors.coast, type:"physical"},
    {name:"Pojezierze Pomorskie", lat:54.0, lng:17.0, color:colors.lowland, type:"physical"},
    {name:"Pojezierze Wielkopolskie", lat:52.6, lng:17.0, color:colors.lowland, type:"physical"},
    {name:"Pojezierze Mazurskie", lat:53.8, lng:21.8, color:colors.lowland, type:"physical"},
    {name:"Nizina Śląska", lat:51.2, lng:16.8, color:colors.lowland, type:"physical"},
    {name:"Nizina Wielkopolska", lat:52.4, lng:17.2, color:colors.lowland, type:"physical"},
    {name:"Nizina Mazowiecka", lat:52.3, lng:21.0, color:colors.lowland, type:"physical"},
    {name:"Podlasie", lat:52.8, lng:23.5, color:colors.lowland, type:"physical"},
    {name:"Polesie Lubelskie", lat:51.4, lng:23.2, color:colors.lowland, type:"physical"},
    {name:"Wyżyna Śląska", lat:50.5, lng:19.2, color:colors.region, type:"physical"},
    {name:"Wyżyna Krakowsko-Częstochowska", lat:50.4, lng:19.8, color:colors.region, type:"physical"},
    {name:"Wyżyna Małopolska", lat:50.2, lng:20.5, color:colors.region, type:"physical"},
    {name:"Wyżyna Lubelska", lat:51.0, lng:22.8, color:colors.region, type:"physical"},
    {name:"Kotlina Oświęcimska", lat:50.0, lng:19.2, color:colors.lowland, type:"physical"},
    {name:"Kotlina Sandomierska", lat:50.6, lng:21.8, color:colors.lowland, type:"physical"},
    {name:"Beskidy", lat:49.6, lng:19.5, color:colors.mountain, type:"physical"},
    {name:"Tatry", lat:49.2, lng:19.9, color:colors.mountain, type:"physical"},
    {name:"Pieniny", lat:49.4, lng:20.4, color:colors.mountain, type:"physical"},
    {name:"Bieszczady", lat:49.1, lng:22.5, color:colors.mountain, type:"physical"},
    {name:"Karkonosze", lat:50.8, lng:15.7, color:colors.mountain, type:"physical"},
    {name:"Góry Świętokrzyskie", lat:50.9, lng:20.9, color:colors.mountain, type:"physical"},

    // 3. Morza i wybrzeże
    {name:"Morze Bałtyckie", lat:54.8, lng:18.5, color:colors.water, type:"physical"},
    {name:"Zatoka Gdańska", lat:54.5, lng:18.8, color:colors.water, type:"physical"},
    {name:"Zalew Szczeciński", lat:53.8, lng:14.4, color:colors.water, type:"physical"},
    {name:"Zalew Wiślany", lat:54.3, lng:19.6, color:colors.water, type:"physical"},
    {name:"Półwysep Helski", lat:54.6, lng:18.8, color:colors.coast, type:"physical"},
    {name:"Mierzeja Wiślana", lat:54.4, lng:19.6, color:colors.coast, type:"physical"},

    // 4. Rzeki
    {name:"Wisła", lat:52.2, lng:21.0, color:colors.river, type:"physical"},
    {name:"Odra", lat:52.6, lng:16.0, color:colors.river, type:"physical"},
    {name:"Warta", lat:52.4, lng:17.0, color:colors.river, type:"physical"},
    {name:"Bug", lat:52.3, lng:23.0, color:colors.river, type:"physical"},
    {name:"Narew", lat:53.0, lng:22.3, color:colors.river, type:"physical"},
    {name:"San", lat:50.6, lng:22.0, color:colors.river, type:"physical"},
    {name:"Noteć", lat:52.9, lng:17.0, color:colors.river, type:"physical"},

    // 5. Jeziora
    {name:"Śniardwy", lat:53.75, lng:21.65, color:colors.lake, type:"physical"},
    {name:"Mamry", lat:54.05, lng:21.55, color:colors.lake, type:"physical"},
    {name:"Łebsko", lat:54.75, lng:17.55, color:colors.lake, type:"physical"},
    {name:"Hańcza", lat:54.27, lng:22.82, color:colors.lake, type:"physical"},

    // 6. Szczyty górskie
    {name:"Rysy", lat:49.18, lng:20.09, color:colors.peak, type:"physical"},
    {name:"Śnieżka", lat:50.74, lng:15.74, color:colors.peak, type:"physical"},
    {name:"Łysica", lat:50.92, lng:20.92, color:colors.peak, type:"physical"},
    {name:"Tarnica", lat:49.08, lng:22.72, color:colors.peak, type:"physical"},

    // 7. Parki narodowe
    {name:"Tatrzański Park Narodowy", lat:49.25, lng:19.95, color:colors.park, type:"physical"},
    {name:"Karkonoski Park Narodowy", lat:50.75, lng:15.72, color:colors.park, type:"physical"},
    {name:"Białowieski Park Narodowy", lat:52.75, lng:23.85, color:colors.park, type:"physical"},
    {name:"Biebrzański Park Narodowy", lat:53.4, lng:22.6, color:colors.park, type:"physical"},
    {name:"Słowiński Park Narodowy", lat:54.65, lng:17.45, color:colors.park, type:"physical"},
    {name:"Kampinoski Park Narodowy", lat:52.3, lng:20.8, color:colors.park, type:"physical"},
    {name:"Ojcowski Park Narodowy", lat:50.2, lng:19.75, color:colors.park, type:"physical"},
    {name:"Bieszczadzki Park Narodowy", lat:49.15, lng:22.55, color:colors.park, type:"physical"}
];

let map, currentLayer;
let physicalLayer, politicalNoLabelLayer, noLabelLayer;
let markers = [];
let mode = 0;
let quiz = [], score = 0, current = 0, answered = false;
let autoAdvanceTimeout = null;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function initMap() {
    map = L.map('map', {
        maxBounds: [[48.8, 13.8], [55.0, 24.2]],
        maxBoundsViscosity: 1.0,
        minZoom: 6,
        maxZoom: 10
    }).setView([52.1, 19.0], 6);

    physicalLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');
    politicalNoLabelLayer = L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_nolabels/{z}/{x}/{y}.png');
    noLabelLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

    currentLayer = politicalNoLabelLayer;
    currentLayer.addTo(map);
}

function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

function loadMarkers(filteredFeatures) {
    clearMarkers();
    filteredFeatures.forEach((f, i) => {
        const marker = L.circleMarker([f.lat, f.lng], {
            radius: 9.5,
            color: "#ffffff",
            weight: 2.8,
            fillColor: f.color,
            fillOpacity: 0.94
        }).addTo(map);
        marker.on("click", () => markerClick(i, marker, filteredFeatures));
        markers.push(marker);
    });
}

function markerClick(clickedIndex, clickedMarker, currentFeatures) {
    if (answered) return;
    answered = true;

    clickedMarker.setRadius(16.5);
    setTimeout(() => clickedMarker.setRadius(9.5), 180);

    const correctName = quiz[current].name;
    const isCorrect = currentFeatures[clickedIndex].name === correctName;

    if (isCorrect) {
        clickedMarker.setStyle({fillColor: "#00cc44"});
        score++;
        document.getElementById("question").innerHTML += " <span style='color:#00cc44'>✔</span>";
    } else {
        clickedMarker.setStyle({fillColor: "#cc0000"});
        document.getElementById("question").innerHTML += " <span style='color:#cc0000'>✘</span>";

        const correctIdx = currentFeatures.findIndex(f => f.name === correctName);
        if (correctIdx !== -1) {
            const correctMarker = markers[correctIdx];
            const originalColor = correctMarker.options.fillColor;
            correctMarker.setStyle({fillColor: "#00cc44", radius: 14});
            setTimeout(() => correctMarker.setStyle({fillColor: originalColor, radius: 9.5}), 1900);
        }
    }

    clearTimeout(autoAdvanceTimeout);
    autoAdvanceTimeout = setTimeout(nextQuestion, 1900);
}

function nextQuestion() {
    current++;
    if (current >= quiz.length) {
        alert(`Koniec testu!\nTwój wynik: ${score}/${quiz.length} 🎉`);
        setMode(mode);
    } else {
        showQuestion();
    }
}

function setMode(newMode) {
    mode = newMode;
    score = 0; current = 0;
    clearTimeout(autoAdvanceTimeout);

    document.querySelectorAll('.mode-buttons button').forEach((b,i) => 
        b.classList.toggle('active', i===mode));

    clearMarkers();

    let filtered = mode === 0 
        ? allFeatures 
        : allFeatures.filter(f => f.type === "physical");

    let layerToUse = mode === 0 ? politicalNoLabelLayer : noLabelLayer;

    if (currentLayer) map.removeLayer(currentLayer);
    layerToUse.addTo(map);
    currentLayer = layerToUse;

    loadMarkers(filtered);

    quiz = [...filtered];
    shuffle(quiz);
    showQuestion();
    document.getElementById("next").style.display = "block";

    updateLegend();
}

function showQuestion() {
    document.getElementById("score").innerHTML = `Wynik: <b>${score}/${quiz.length}</b>`;
    document.getElementById("counter").innerHTML = `Pytanie <b>${current + 1} / ${quiz.length}</b>`;
    document.getElementById("question").innerHTML = `Wskaż: <b>${quiz[current].name}</b>`;
    answered = false;

    markers.forEach((m, i) => m.setStyle({fillColor: quiz[i].color}));
}

function updateLegend() {
    const legend = document.getElementById("legend");
    if (mode === 0) {
        legend.innerHTML = `<b>Test – Obiekty geograficzne Polski</b><br>Znajdź zaznaczone obiekty`;
    } else {
        legend.innerHTML = `<b>Test – Mapa Fizyczna Polski</b><br>
            <span class="color-dot" style="background:#1e4a7a"></span> Wody / Rzeki / Jeziora<br>
            <span class="color-dot" style="background:#5c4033"></span> Góry / Szczyty<br>
            <span class="color-dot" style="background:#4a8c3d"></span> Niziny / Pojezierza<br>
            <span class="color-dot" style="background:#d17f2a"></span> Pobrzeża / Wybrzeże<br>
            <span class="color-dot" style="background:#2e8b57"></span> Parki Narodowe`;
    }
}

document.getElementById("next").onclick = nextQuestion;

window.onload = () => {
    initMap();
    setTimeout(() => map.invalidateSize(), 200);
    setMode(0);
};
</script>
</body>
</html>
