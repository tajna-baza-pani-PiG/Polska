<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Lato', sans-serif; background: #eef2f7; }
#container { padding: 14px 12px; max-width: 980px; margin: auto; }
#header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
#header h1 { font-family: 'Merriweather', serif; font-size: 19px; margin: 0; color: #1a2e4a; }
.mode-buttons { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.mode-buttons button { padding: 8px 18px; font-size: 14px; font-family: 'Lato', sans-serif; font-weight: 700; border: 2px solid #c5cfe0; border-radius: 20px; cursor: pointer; background: #fff; color: #4a5568; transition: all .15s; }
.mode-buttons button:hover  { border-color: #2d89ef; color: #2d89ef; }
.mode-buttons button.active { background: #2d89ef; border-color: #2d89ef; color: #fff; }
#quiz-panel { background: #fff; border-radius: 12px; padding: 8px 14px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.07); display: flex; flex-direction: column; gap: 2px; }
#counter { font-size: 11px; color: #8896aa; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; line-height: 1.3; }
#question { font-size: 18px; font-weight: 700; color: #1a2e4a; line-height: 1.3; }
#feedback { font-size: 13px; font-weight: 700; line-height: 1.3; }
#feedback:empty { display: none; }
#feedback.correct { color: #1b7c3f; }
#feedback.wrong   { color: #b91c1c; }
#score { font-size: 12px; color: #4a5568; border-top: 1px solid #eef2f7; padding-top: 4px; margin-top: 2px; line-height: 1.3; }
#score b { color: #2d89ef; font-size: 13px; }
#map { height: calc(100vh - 185px); min-height: 340px; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); overflow: hidden; }
body.mode-krainy #map { height: calc(100vh - 185px); }
@media (max-width: 600px) {
  #map { height: calc(100vh - 210px); min-height: 260px; border-radius: 10px; }
  body.mode-krainy #map { height: calc(100vh - 205px); }
  #header h1 { font-size: 15px; }
  #question  { font-size: 16px; }
}
#legend { margin-top: 10px; padding: 12px 16px; background: #fff; border-radius: 10px; font-size: 13px; color: #4a5568; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
#legend b { color: #1a2e4a; display: block; margin-bottom: 8px; }
.leg-section { margin-bottom: 10px; }
.leg-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #8896aa; margin-bottom: 5px; }
.leg-row { display: flex; flex-wrap: wrap; gap: 5px 16px; }
.leg-item { display: flex; align-items: center; gap: 6px; line-height: 1.4; }
.icon-sym { font-size: 14px; line-height: 1; }
.line-sym { width: 22px; height: 4px; border-radius: 2px; flex-shrink: 0; background: #1565c0; }
</style>
</head>

var map, topoLayer, osmLayer, activeTileLayer;
var geoLayers = [];

function initMap() {
  map = L.map('map', {
    maxBoundsViscosity: 0.5,
    minZoom: 5,
    maxZoom: 12
  }).setView([52.1, 19.4], 6);

  map.setMaxBounds([[45.0, 8.0], [57.5, 28.0]]);

  // OSM z polskimi nazwami miast i granicą Polski
  topoLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 13
  });

  // Tryb RZEKI: standardowy OSM
  osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 13
  });

  activeTileLayer = topoLayer;
  topoLayer.addTo(map);
}

function clearLayers() {
  for (var i = 0; i < geoLayers.length; i++) map.removeLayer(geoLayers[i]);
  geoLayers = [];
}

function renderKrainy() {
  clearLayers();
  KRAINY.forEach(function(k) {
    var style = {
      color: '#1a2e4a', weight: 2, opacity: 0.9,
      fillColor: '#3a86ff', fillOpacity: 0.18
    };
    var poly = L.polygon(k.coords, style);
    poly.featureName = k.name;
    poly.on('click', function(e) {
      L.DomEvent.stopPropagation(e);
      handleAnswer(k.name);
    });
    poly.on('mouseover', function() {
      if (!answered) poly.setStyle({ fillOpacity: 0.35, weight: 3 });
    });
    poly.on('mouseout', function() {
      if (!answered) poly.setStyle({ fillOpacity: 0.18, weight: 2 });
    });
    poly.addTo(map);
    geoLayers.push(poly);
  });
}

function renderPunkty() {
  clearLayers();
  RZEKI.forEach(function(r) {
    var line = L.polyline(r.coords, { color: '#1565c0', weight: 5, opacity: 0.9 });
    line.featureName = r.name;
    line.on('click', function(e) { L.DomEvent.stopPropagation(e); handleAnswer(r.name); });
    line.addTo(map);
    geoLayers.push(line);
  });
  PUNKTY.forEach(function(p) {
    var st = KAT_PUNKTY[p.cat];
    var icon = L.divIcon({
      className: '',
      html: '<div style="background:' + st.fill + ';color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer">' + st.icon + '</div>',
      iconSize: [32,32], iconAnchor: [16,16]
    });
    var marker = L.marker([p.lat, p.lng], { icon: icon });
    marker.featureName = p.name;
    marker._defaultIcon = icon;
    marker._correctIcon = L.divIcon({ className:'', html:'<div style="background:#00c853;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #006622;box-shadow:0 2px 6px rgba(0,0,0,.35)">' + st.icon + '</div>', iconSize:[32,32], iconAnchor:[16,16] });
    marker._wrongIcon  = L.divIcon({ className:'', html:'<div style="background:#ef4444;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #991b1b;box-shadow:0 2px 6px rgba(0,0,0,.35)">' + st.icon + '</div>', iconSize:[32,32], iconAnchor:[16,16] });
    marker.on('click', function(e) { L.DomEvent.stopPropagation(e); handleAnswer(p.name); });
    marker.addTo(map);
    geoLayers.push(marker);
  });
}

var quiz = [], score = 0, current = 0, answered = false;
var autoTimer = null;
var currentMode = 'krainy';

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

function handleAnswer(clicked) {
  if (answered) return;
  answered = true;
  var correct = quiz[current];
  var ok = (clicked === correct);
  if (ok) score++;
  var fb = document.getElementById('feedback');
  fb.className  = ok ? 'correct' : 'wrong';
  fb.textContent = ok
    ? '✔ Dobrze! To ' + correct
    : '✘ Błąd – wybrałeś: „' + clicked + '". Prawidłowo: „' + correct + '"';
  highlightLayer(clicked,  ok ? '#00c853' : '#ef4444');
  if (!ok) highlightLayer(correct, '#00c853');
  document.getElementById('score').innerHTML = 'Wynik: <b>' + score + '</b> / ' + quiz.length;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(nextQuestion, 2600);
}

function highlightLayer(name, color) {
  geoLayers.forEach(function(l) {
    if (l.featureName !== name) return;
    if (l.setIcon) {
      l.setIcon(color === '#00c853' ? l._correctIcon : l._wrongIcon);
    } else if (l.setStyle) {
      l.setStyle({ fillColor: color, fillOpacity: 0.60, color: color, weight: 3 });
    }
  });
}

function nextQuestion() {
  current++;
  if (current >= quiz.length) {
    var pct = Math.round(score / quiz.length * 100);
    alert('Koniec testu!\nWynik: ' + score + '/' + quiz.length + ' (' + pct + '%) 🎉');
    setMode(currentMode);
    return;
  }
  if (currentMode === 'krainy') renderKrainy(); else renderPunkty();
  showQuestion();
}

function showQuestion() {
  document.getElementById('counter').textContent  = 'Pytanie ' + (current+1) + ' / ' + quiz.length;
  document.getElementById('question').textContent = '▸ ' + quiz[current];
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className   = '';
  document.getElementById('score').innerHTML      = 'Wynik: <b>' + score + '</b> / ' + quiz.length;
  answered = false;
}


// ════════════════════════════════════════════════════════
//  TRYBY
// ════════════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  score = 0; current = 0; answered = false;
  clearTimeout(autoTimer);
  document.querySelectorAll('.mode-buttons button').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btn-' + mode).classList.add('active');
  map.removeLayer(activeTileLayer);
  activeTileLayer = (mode === 'punkty') ? osmLayer : topoLayer;
  activeTileLayer.addTo(map);
  if (mode === 'krainy') {
    renderKrainy();
    quiz = KRAINY.map(function(k) { return k.name; });
  } else {
    renderPunkty();
    quiz = RZEKI.concat(PUNKTY).map(function(o) { return o.name; });
  }
  shuffle(quiz);
  updateLegend(mode);
  showQuestion();
}

function updateLegend(mode) {
  var el = document.getElementById('legend');
  document.body.className = 'mode-' + mode;
  if (mode === 'krainy') {
    el.style.display = 'none';
    el.innerHTML = '';
  } else {
    el.style.display = 'block';
    var katItems = Object.keys(KAT_PUNKTY).map(function(cat) {
      var k = KAT_PUNKTY[cat];
      return '<span class="leg-item"><span class="icon-sym">' + k.icon + '</span>' + k.opis + '</span>';
    }).join('');
    el.innerHTML = '<b>Rzeki i obiekty geograficzne Polski</b>'
      + '<div class="leg-section"><div class="leg-section-title">Rzeki (kliknij linię)</div>'
      + '<div class="leg-row"><span class="leg-item"><span class="line-sym"></span>Wisła, Odra, Warta, Bug</span></div></div>'
      + '<div class="leg-section"><div class="leg-section-title">Punkty (kliknij marker)</div>'
      + '<div class="leg-row">' + katItems + '</div></div>';
  }
}


// ════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════
window.onload = function() {
  initMap();
  setTimeout(function() { map.invalidateSize(); }, 200);
  setMode('krainy');
};

</script>
