<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polska – Test Geograficzny</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; font-family:'Lato',sans-serif; background:#eef2f7; }
        #container { padding:14px 12px; max-width:980px; margin:auto; }
        #header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        #header h1 { font-family:'Merriweather',serif; font-size:19px; margin:0; color:#1a2e4a; }
        
        .mode-buttons { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
        .mode-buttons button { 
            padding:8px 18px; font-size:14px; font-weight:700; border:2px solid #c5cfe0; 
            border-radius:20px; cursor:pointer; background:#fff; color:#4a5568; 
        }
        .mode-buttons button:hover { border-color:#2d89ef; color:#2d89ef; }
        .mode-buttons button.active { background:#2d89ef; border-color:#2d89ef; color:#fff; }

        #quiz-panel { 
            background:#fff; border-radius:12px; padding:11px 16px; margin-bottom:10px; 
            box-shadow:0 2px 8px rgba(0,0,0,.07); 
        }
        #counter { font-size:12px; color:#8896aa; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
        #question { font-size:20px; font-weight:700; color:#1a2e4a; min-height:30px; }
        #feedback { font-size:15px; min-height:20px; font-weight:700; padding:2px 0; }
        #feedback.correct { color:#1b7c3f; }
        #feedback.wrong { color:#b91c1c; }
        #score { font-size:13px; color:#4a5568; border-top:1px solid #eef2f7; padding-top:5px; margin-top:2px; }
        #score b { color:#2d89ef; font-size:15px; }

        #map { 
            height:68vh; min-height:480px; border-radius:14px; 
            box-shadow:0 6px 24px rgba(0,0,0,.18); 
        }

        #next { 
            width:100%; padding:12px; margin-top:10px; background:#2d89ef; color:#fff; 
            font-weight:700; border:none; border-radius:10px; cursor:pointer; 
        }
        #next:hover { background:#1a6fcc; }

        #legend { 
            margin-top:10px; padding:10px 14px; background:#fff; border-radius:10px; 
            font-size:13px; line-height:1.8; color:#4a5568; box-shadow:0 1px 4px rgba(0,0,0,.06); 
        }
        .leg-row { display:flex; flex-wrap:wrap; gap:5px 16px; margin-top:4px; }
        .leg-item { display:flex; align-items:center; gap:5px; }
        .dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,.15); }
        .line-sym { width:22px; height:4px; border-radius:2px; flex-shrink:0; }
    </style>
</head>
<body>
<div id="container">
    <div id="header">
        <span style="font-size:26px">🇵🇱</span>
        <h1>Test Geograficzny – Polska</h1>
    </div>
    <div class="mode-buttons">
        <button onclick="setMode('krainy')" id="btn-krainy">🗺 Krainy Geograficzne</button>
        <button onclick="setMode('others')" id="btn-others">🌊 Rzeki i Obiekty</button>
    </div>
    <div id="quiz-panel">
        <div id="counter"></div>
        <div id="question"></div>
        <div id="feedback"></div>
        <div id="score"></div>
    </div>
    <div id="map"></div>
    <button id="next">Następne pytanie ▶</button>
    <div id="legend"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== DANE ====================
const KRAINY_META = [
  { name:"Pobrzeże Szczecińskie", color:"#0d47a1" },
  { name:"Pobrzeże Koszalińskie", color:"#1565c0" },
  { name:"Pobrzeże Słowińskie", color:"#1976d2" },
  { name:"Pobrzeże Gdańskie", color:"#1e88e5" },
  { name:"Pojezierze Pomorskie", color:"#2e7d32" },
  { name:"Pojezierze Mazurskie", color:"#388e3c" },
  { name:"Nizina Wielkopolska", color:"#795548" },
  { name:"Nizina Mazowiecka", color:"#8d6e63" },
  { name:"Nizina Śląska", color:"#6d4c41" },
  { name:"Podlasie", color:"#4e342e" },
  { name:"Wyżyna Krakowsko-Częstochowska", color:"#e64a19" },
  { name:"Wyżyna Małopolska", color:"#f4511e" },
  { name:"Góry Świętokrzyskie", color:"#b71c1c" },
];

const FALLBACK_COORDS = { /* ... Twoje koordynaty bez zmian ... */ };
// (pozostawiam FALLBACK_COORDS bez zmian - wklej je z poprzedniej wersji)

const OTHERS = [ /* ... bez zmian ... */ ];
const CAT_STYLE = { /* ... bez zmian ... */ };

// ==================== STAN ====================
let map, topoLayer, osmLayer, currentTileLayer;
let geoLayers = [];
let quiz = [], score = 0, current = 0, answered = false;
let currentMode = 'krainy';

// ==================== MAPA ====================
function initMap() {
    map = L.map('map', {
        maxBounds: [[48.3,12.8],[55.6,25.2]],
        maxBoundsViscosity: 0.85,
        minZoom: 6,
        maxZoom: 12
    }).setView([52.1, 19.4], 6);

    topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' });
    osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
    currentTileLayer = topoLayer;
    topoLayer.addTo(map);
}

// ==================== WARSTWY ====================
function clearGeoLayers() {
    geoLayers.forEach(l => map.removeLayer(l));
    geoLayers = [];
}

function makeGeoLayer(features, color, name) {
    const layer = L.geoJSON(features, {
        style: {
            color: '#1a2e4a',
            weight: 1.8,
            opacity: 0.85,
            fillColor: color,
            fillOpacity: 0.45
        },
        onEachFeature: (feature, layer) => {
            layer.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                handleAnswer(name, e.latlng);
            });
        }
    });
    layer.featureName = name;
    layer.addTo(map);
    geoLayers.push(layer);
    return layer;
}

function renderKrainy() {
    clearGeoLayers();
    Object.entries(FALLBACK_COORDS).forEach(([name, latLngs]) => {
        const ring = latLngs.map(c => [c[1], c[0]]);
        ring.push(ring[0]);
        
        makeGeoLayer([{
            type: 'Feature',
            geometry: { type: 'Polygon', coordinates: [ring] }
        }], COLOR_BY_NAME[name] || '#607d8b', name);
    });
}

function renderOthers() {
    clearGeoLayers();
    OTHERS.forEach(item => {
        const st = CAT_STYLE[item.cat];
        let layer;

        if (item.cat === 'river') {
            L.polyline(item.coords, { color: '#fff', weight: st.weight + 5, opacity: 0.3, interactive: false }).addTo(map);
            layer = L.polyline(item.coords, { 
                color: st.color, 
                weight: st.weight, 
                opacity: st.opacity 
            });
        } else {
            const icon = L.divIcon({
                html: `<div style="background:${st.fill};color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer">${st.icon}</div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
            layer = L.marker([item.lat, item.lng], { icon });
        }

        layer.featureName = item.name;
        layer.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            handleAnswer(item.name, e.latlng);
        });
        layer.addTo(map);
        geoLayers.push(layer);
    });
}

// ==================== QUIZ ====================
const COLOR_BY_NAME = Object.fromEntries(KRAINY_META.map(k => [k.name, k.color]));

function shuffle(arr) { /* ... bez zmian ... */ }

function handleAnswer(clickedName, latlng) {
    if (answered) return;
    answered = true;

    const correct = quiz[current];
    const isCorrect = clickedName === correct;

    const fb = document.getElementById('feedback');
    fb.className = isCorrect ? 'correct' : 'wrong';
    fb.textContent = isCorrect 
        ? `✔ Dobrze! To ${correct}` 
        : `✘ Błąd – wybrałeś „${clickedName}". Prawidłowo: „${correct}"`;

    if (isCorrect) score++;

    // Podświetlenie
    geoLayers.forEach(l => {
        if (l.featureName === clickedName || l.featureName === correct) {
            if (l.setStyle) l.setStyle({ fillColor: isCorrect || l.featureName === correct ? '#00c853' : '#ef4444', fillOpacity: 0.75 });
        }
    });

    document.getElementById('score').innerHTML = `Wynik: <b>${score}</b> / ${quiz.length}`;
    setTimeout(advanceQuestion, 2400);
}

function advanceQuestion() {
    current++;
    if (current >= quiz.length) {
        const pct = Math.round(score / quiz.length * 100);
        alert(`Koniec testu!\nWynik: ${score}/${quiz.length} (${pct}%)`);
        setMode(currentMode);
        return;
    }
    if (currentMode === 'krainy') renderKrainy();
    else renderOthers();
    showQuestion();
}

function showQuestion() {
    document.getElementById('counter').textContent = `Pytanie ${current+1} / ${quiz.length}`;
    document.getElementById('question').textContent = '▸ ' + quiz[current];
    document.getElementById('feedback').textContent = '';
    answered = false;
}

// ==================== TRYB ====================
function setMode(mode) {
    currentMode = mode;
    score = 0; current = 0; answered = false;

    document.querySelectorAll('.mode-buttons button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mode).classList.add('active');

    map.removeLayer(currentTileLayer);
    currentTileLayer = (mode === 'others') ? osmLayer : topoLayer;
    currentTileLayer.addTo(map);

    if (mode === 'krainy') {
        quiz = KRAINY_META.map(k => k.name);
        updateLegend();
        renderKrainy();
    } else {
        quiz = OTHERS.map(d => d.name);
        updateLegend();
        renderOthers();
    }

    shuffle(quiz);
    showQuestion();
}

function updateLegend() {
    const el = document.getElementById('legend');
    if (currentMode === 'krainy') {
        el.innerHTML = `<b>Krainy geograficzne Polski</b><div class="leg-row">${
            KRAINY_META.map(k => 
                `<span class="leg-item"><span class="dot" style="background:${k.color}"></span>${k.name}</span>`
            ).join('')
        }</div>`;
    } else {
        el.innerHTML = `<b>Legenda:</b><div class="leg-row">... (bez zmian) ...</div>`;
    }
}

// ==================== START ====================
window.onload = () => {
    initMap();
    setTimeout(() => map.invalidateSize(), 100);
    setMode('krainy');
    
    document.getElementById('next').onclick = () => {
        if (answered) advanceQuestion();
    };
};
</script>
</body>
</html>
