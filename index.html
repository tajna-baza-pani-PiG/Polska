<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

        #header h1 { font-family:'Merriweather',serif; font-size:19px; margin:0; color:#1a2e4a; }
        .mode-buttons { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
        .mode-buttons button {
            padding:8px 18px; font-size:14px; font-family:'Lato',sans-serif;
            font-weight:700; border:2px solid #c5cfe0; border-radius:20px;
            cursor:pointer; background:#fff; color:#4a5568; transition:all .15s;
        }
        .mode-buttons button:hover { border-color:#2d89ef; color:#2d89ef; }
        .mode-buttons button.active { background:#2d89ef; border-color:#2d89ef; color:#fff; box-shadow:0 2px 8px rgba(45,137,239,.35); }
        #quiz-panel { background:#fff; border-radius:12px; padding:11px 16px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,0.07); display:flex; flex-direction:column; gap:4px; }
        #counter { font-size:12px; color:#8896aa; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
        #question { font-size:20px; font-weight:700; color:#1a2e4a; min-height:30px; }
        #feedback { font-size:15px; min-height:20px; font-weight:700; padding:2px 0; }
        #feedback.correct { color:#1b7c3f; }
        #feedback.wrong   { color:#b91c1c; }
        #score { font-size:13px; color:#4a5568; border-top:1px solid #eef2f7; padding-top:5px; margin-top:2px; }
        #score b { color:#2d89ef; font-size:15px; }
        #map { height:68vh; min-height:480px; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,0.18); position:relative; overflow:hidden; }
        #next { width:100%; padding:12px; margin-top:10px; background:#2d89ef; color:#fff; font-family:'Lato',sans-serif; font-size:16px; font-weight:700; border:none; border-radius:10px; cursor:pointer; display:none; box-shadow:0 3px 10px rgba(45,137,239,.4); transition:background .15s; }
        #next:hover { background:#1a6fcc; }
        #legend { margin-top:10px; padding:10px 14px; background:#fff; border-radius:10px; font-size:13px; line-height:1.8; color:#4a5568; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
        #legend b { color:#1a2e4a; }
        .leg-row { display:flex; flex-wrap:wrap; gap:5px 16px; margin-top:4px; }
        .leg-item { display:flex; align-items:center; gap:5px; }
        .dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,0.15); }
        .line-sym { width:22px; height:4px; border-radius:2px; flex-shrink:0; }
        #info-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(20,30,50,0.85); color:#fff; padding:8px 20px; border-radius:24px; font-size:13px; z-index:500; pointer-events:none; white-space:nowrap; display:none; box-shadow:0 2px 8px rgba(0,0,0,0.3); }

// ── Mapowanie województwo → kraina ───────────────────────────────────────
// Kompatybilne z simplemaps.com i andilabs GeoJSON (pole "name" lub "NAME_1")

  // Zachodniopomorskie → Pobrzeże Szczecińskie (pn.) + Pojezierze Pomorskie (pd.)
  "zachodniopomorskie":    "Pojezierze Pomorskie",   // dominuje
  "pomorskie":             "Pojezierze Pomorskie",   // Bory Tucholskie, Kaszuby
  "warmińsko-mazurskie":   "Pojezierze Mazurskie",
  "podlaskie":             "Podlasie",
  "wielkopolskie":         "Nizina Wielkopolska",
  "kujawsko-pomorskie":    "Nizina Wielkopolska",    // Kujawy + Bory
  "łódzkie":               "Nizina Mazowiecka",      // część Niziny Mazowieckiej
  "mazowieckie":           "Nizina Mazowiecka",
  "dolnośląskie":          "Nizina Śląska",
  "opolskie":              "Nizina Śląska",

  "świętokrzyskie":        "Góry Świętokrzyskie",
  "lubelskie":             "Wyżyna Małopolska",      // Wyżyna Lubelska ≈ Małopolska w szk.podst.
  "podkarpackie":          "Wyżyna Małopolska",      // Kotlina Sandomierska
  "lubuskie":              "Nizina Śląska",
};

// Obsługa wgrywania zewnętrznego GeoJSON
document.getElementById('geojson-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const gj = JSON.parse(ev.target.result);
            loadExternalGeoJSON(gj);
        } catch(err) {
            alert('Błąd parsowania pliku GeoJSON: ' + err.message);
        }
    };
    reader.readAsText(file);
});

function loadExternalGeoJSON(gj) {
    clearGeoLayers();
    // Grupuj feature'y per kraina
    const krainaMap = {};
    gj.features.forEach(f => {
        const p = f.properties;
        // Różne źródła używają różnych pól z nazwą
        const name = (p.name || p.NAME_1 || p.JPT_NAZWA_ || p.VARNAME_1 || '').toLowerCase().trim();
        const kraina = WOJ_DO_KRAINY[name];
        if (!kraina) return;
        if (!krainaMap[kraina]) krainaMap[kraina] = [];
        krainaMap[kraina].push(f);
    });

    if (Object.keys(krainaMap).length === 0) {
        alert('Nie rozpoznano nazw województw w tym pliku.\nSpróbuj pobrać plik z simplemaps.com/gis/country/pl (przycisk "Download GeoJSON").');
        return;
    }

    Object.entries(krainaMap).forEach(([kraina, features]) => {
        const color = KRAINY_DATA.find(k=>k.name===kraina)?.color || '#607d8b';
        const layer = L.geoJSON({type:'FeatureCollection',features}, {
            style: { color:'#1a2e4a', weight:1.5, opacity:.85, fillColor:color, fillOpacity:.45 }
        });
        layer.featureName = kraina;
        layer.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(kraina, e.latlng); });
        layer.addTo(map);
        geoLayers.push(layer);
    });

    // Nadpisz quiz żeby działał z nowymi warstwami
    document.getElementById('geojson-upload').innerHTML = '<b style="color:#1b7c3f">✔ Wgrano prawdziwy GeoJSON województw!</b> Odśwież quiz przyciskiem poniżej lub zmieniając tryb.';
}

  sea:   { fill:'#0277bd', icon:'🌊' },
  lake:  { fill:'#29b6f6', icon:'💧' },

// ── Stan ───────────────────────────────────────────────────────────────────
let map, topoLayer, osmLayer, currentTileLayer;
let geoLayers = [];
let quiz = [], score = 0, current = 0, answered = false;
let autoAdvanceTimeout = null;
let currentMode = 'krainy';

function initMap() {
    map = L.map('map', {
        maxBounds:[[48.3,12.8],[55.6,25.2]], maxBoundsViscosity:.85,
        minZoom:6, maxZoom:12
    }).setView([52.1,19.4],6);
    topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution:'© OpenTopoMap', opacity:.85 });
    osmLayer  = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' });
    currentTileLayer = topoLayer;
    topoLayer.addTo(map);
}

// ── Rysuj krainy ──────────────────────────────────────────────────────────
function renderKrainy() {
    clearGeoLayers();
    KRAINY_DATA.forEach(k => {
        // Zamień [lat,lng] → GeoJSON [lng,lat]
        const ring = k.coords.map(c => [c[1], c[0]]);
        ring.push(ring[0]); // zamknij pierścień
        const geojson = {
            type: "Feature",
            properties: { name: k.name },
            geometry: { type: "Polygon", coordinates: [ring] }
        };
        const layer = L.geoJSON(geojson, {
            style: {
                color: '#1a2e4a', weight: 1.8, opacity: .85,
                fillColor: k.color, fillOpacity: .45,
                dashArray: null
            }
        });
        layer.featureName = k.name;
        layer.on('click', e => {
            L.DomEvent.stopPropagation(e);
            handleAnswer(k.name, e.latlng);
        });
        // tooltip ukryty celowo – to quiz
        layer.addTo(map);
        geoLayers.push(layer);
    });
}

// ── Rysuj rzeki i obiekty ──────────────────────────────────────────────────
function renderOthers() {
    clearGeoLayers();
    OTHERS.forEach(item => {
        const st = CAT_STYLE[item.cat];
        let layer;
        if (item.cat === 'river') {
            const shadow = L.polyline(item.coords, { color:'#fff', weight:st.weight+5, opacity:.3 });
            shadow.addTo(map); geoLayers.push(shadow);
            layer = L.polyline(item.coords, { color:st.color, weight:st.weight, opacity:st.opacity });
            // bez tooltip – quiz
            layer.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(item.name, e.latlng); });
            shadow.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(item.name, e.latlng); });
        } else {
            const icon = L.divIcon({
                className:'',
                html:`<div style="background:${st.fill};color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer">${st.icon}</div>`,
                iconSize:[32,32], iconAnchor:[16,16]
            });
            layer = L.marker([item.lat, item.lng], { icon });
            // bez tooltip – quiz
            layer.on('click', e => { L.DomEvent.stopPropagation(e); handleAnswer(item.name, e.latlng); });
        }
        layer.featureName = item.name;
        layer.addTo(map);
        geoLayers.push(layer);
    });
}

function clearGeoLayers() {
    geoLayers.forEach(l => map.removeLayer(l));
    geoLayers = [];
}

// ── Quiz ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
    for (let i = arr.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
}

function handleAnswer(clickedName, latlng) {
    if (answered) return;
    answered = true;
    const correct = quiz[current];
    const isCorrect = clickedName === correct;
    const fb = document.getElementById('feedback');
    fb.className = isCorrect ? 'correct' : 'wrong';
    if (isCorrect) {
        score++;
        fb.textContent = '✔ Dobrze! To ' + correct;
    } else {
        fb.textContent = `✘ Błąd – wybrałeś: „${clickedName}". Prawidłowo: „${correct}"`;
    }
    pulseLayer(clickedName, isCorrect ? '#00c853' : '#ef4444');
    if (!isCorrect) pulseLayer(correct, '#00c853');
    document.getElementById('score').innerHTML = `Wynik: <b>${score}</b> / ${quiz.length}`;
    clearTimeout(autoAdvanceTimeout);
    autoAdvanceTimeout = setTimeout(advanceQuestion, 2600);
}

function pulseLayer(name, color) {
    geoLayers.forEach(l => {
        if (l.featureName !== name) return;
        const style = { fillColor:color, fillOpacity:.78, color:color, weight:3 };
        if (l.setStyle) l.setStyle(style);
        if (l.eachLayer) l.eachLayer(sub => sub.setStyle && sub.setStyle(style));
    });
}

function advanceQuestion() {
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    current++;
    if (current >= quiz.length) {
        const pct = Math.round(score/quiz.length*100);
        alert(`Koniec testu!\nWynik: ${score}/${quiz.length} (${pct}%) 🎉`);
        setMode(currentMode);
        return;
    }
    if (currentMode === 'krainy') renderKrainy();
    else renderOthers();
    showQuestion();
}

function showQuestion() {
    document.getElementById('score').innerHTML    = `Wynik: <b>${score}</b> / ${quiz.length}`;
    document.getElementById('counter').textContent = `Pytanie ${current+1} / ${quiz.length}`;
    document.getElementById('question').textContent = '▸ ' + quiz[current];
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    answered = false;
}

function showInfoBar(msg, ms) {
    const el = document.getElementById('info-bar');
    el.textContent = msg; el.style.display = 'block';
    if (ms) setTimeout(() => el.style.display='none', ms);
}

function setMode(mode) {
    currentMode = mode;
    score=0; current=0; answered=false;
    clearTimeout(autoAdvanceTimeout);
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='';
    document.querySelectorAll('.mode-buttons button').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+mode).classList.add('active');
    map.removeLayer(currentTileLayer);
    currentTileLayer = (mode==='others') ? osmLayer : topoLayer;
    currentTileLayer.addTo(map);

    if (mode==='krainy') {
        renderKrainy();
        quiz = KRAINY_DATA.map(k=>k.name);
    } else {
        renderOthers();
        quiz = OTHERS.map(d=>d.name);
    }
    shuffle(quiz);
    document.getElementById('next').style.display='block';
    updateLegend();
    showQuestion();
}

function updateLegend() {
    const el = document.getElementById('legend');
    if (currentMode==='krainy') {
        const rows = KRAINY_DATA.map(k =>
            `<span class="leg-item"><span class="dot" style="background:${k.color}"></span>${k.name}</span>`
        ).join('');
        el.innerHTML = `<b>Krainy geograficzne Polski</b><div class="leg-row">${rows}</div>`;
    } else {
        el.innerHTML = `<b>Legenda:</b><div class="leg-row">
          <span class="leg-item"><span class="line-sym" style="background:#1565c0"></span>Rzeki</span>
          <span class="leg-item"><span class="dot" style="background:#0277bd"></span>Morza/akweny 🌊</span>
          <span class="leg-item"><span class="dot" style="background:#29b6f6"></span>Jeziora 💧</span>
          <span class="leg-item"><span class="dot" style="background:#c62828"></span>Szczyty ⛰</span>
          <span class="leg-item"><span class="dot" style="background:#2e7d32"></span>Parki PN 🌿</span>
        </div>`;
    }
}

document.getElementById('next').onclick = () => {
    if (!answered) return;
    clearTimeout(autoAdvanceTimeout);
    advanceQuestion();
};

window.onload = () => {
    initMap();
    setTimeout(()=>map.invalidateSize(), 200);
    setMode('krainy');
};
</script>
</body>
</html>
